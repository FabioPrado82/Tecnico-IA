<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prancheta_ — Save FC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233D3935'/%3E%3Ctext x='50' y='68' font-size='48' font-family='monospace' font-weight='bold' fill='%2352FF2B' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
<style>
  :root {
    --charcoal: #3D3935;
    --charcoal-light: #5A5650;
    --muted: #8A8680;
    --green: #52FF2B;
    --green-text: #2E7D0F;
    --bg: #FAFAFA;
    --card-bg: #FFFFFF;
    --border: #E8E6E1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; background: var(--bg); color: var(--charcoal); padding-bottom: 88px; }
  .app-header-top { background: var(--charcoal); color: #fff; padding: 6px 16px; display: flex; align-items: center; gap: 6px; }
  .app-header-top .logo-mark { color: var(--green); font-size: 13px; font-weight: 500; font-family: monospace; }
  .app-header-top .app-name-compact { font-size: 11px; font-weight: 500; color: #fff; }
  .app-header-top .app-by { color: var(--muted); font-weight: 400; }
  .clube-banda { padding: 14px 16px; display: none; align-items: center; gap: 12px; background: var(--charcoal); }
  .clube-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .clube-nome { font-size: 18px; font-weight: 600; color: #fff; margin: 0; }
  .clube-subtitulo { font-size: 11px; color: rgba(255,255,255,0.75); margin: 0; }
  .container { padding: 16px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(61,57,53,0.04); }
  .btn-secundario { background: #fff; border: 1.5px solid var(--border); color: var(--charcoal); font-weight: 500; width: 100%; }
  .btn-secundario:hover { border-color: var(--green); }
  .vazio { text-align: center; padding: 32px 16px; color: var(--muted); }
  .vazio i { font-size: 32px; color: #D8D6D1; display: block; margin-bottom: 8px; }
  .vazio p { font-size: 13px; margin: 0; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--charcoal); }
  label { display: block; font-size: 13px; color: var(--charcoal-light); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; color: var(--charcoal); }
  button { cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 14px; padding: 10px 14px; color: var(--charcoal); }
  .btn-primary { background: var(--charcoal); color: #fff; border: none; font-weight: 600; width: 100%; }
  .erro { color: #c0392b; font-size: 13px; margin-top: 8px; }
  .linha-partida { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .linha-partida .info { font-size: 13px; color: var(--muted); }
  .badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; background: #EAFBE3; color: var(--green-text); }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .menu-grid a { display: block; text-align: center; text-decoration: none; color: var(--charcoal); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 6px; font-size: 13px; font-weight: 500; }
  .menu-grid a:hover { border-color: var(--green); }
  #form-nova-partida { display: none; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
  #tela-login { }
  #tela-partidas { display: none; }
  .sair { text-align: center; margin-top: 8px; }
  .sair button { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; }
  #secao-atletas { display: none; }
  .linha-atleta { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 6px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--charcoal); margin: 0; }
  .chk input { width: auto; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bottom-nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; background: #fff; border-top: 1px solid var(--border); display: none; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); z-index: 10; }
  .bottom-nav button { flex: 1; border: none; background: none; padding: 4px 0; font-size: 11px; color: var(--muted); border-radius: 0; }
  .bottom-nav-itens { display: flex; }
  .bottom-nav-itens > div { flex: 1; text-align: center; cursor: pointer; padding: 4px 0; }
  .bottom-nav-icone { display: block; font-size: 22px; color: #B8B6AF; line-height: 1; margin-bottom: 3px; transition: color 0.15s; }
  .bottom-nav-ativo .bottom-nav-icone { color: var(--green-text); }
  .bottom-nav-ativo .bottom-nav-label { color: var(--charcoal); font-weight: 600; }
  .bottom-nav-label { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<header class="app-header-top">
  <span class="logo-mark">&gt;_</span>
  <span class="app-name-compact">Prancheta_ <span class="app-by">por NDEVS</span></span>
</header>
<div class="clube-banda" id="clube-banda">
  <div class="clube-avatar" id="clube-avatar">SC</div>
  <div>
    <p class="clube-nome" id="header-contexto"></p>
    <p class="clube-subtitulo">Gestão de futebol</p>
  </div>
</div>

<div class="container">
<div id="tela-login" class="card">
  <h2>Entrar</h2>
  <label>E-mail</label>
  <input type="email" id="login-email" placeholder="seu@email.com">
  <label>Senha</label>
  <input type="password" id="login-senha">
  <button class="btn-primary" style="margin-top:16px;" onclick="entrar()">Entrar</button>
  <p class="erro" id="login-erro" style="display:none;"></p>
</div>

<div id="tela-partidas">
  <div id="secao-partidas">
  <div class="card">
    <h2>Partidas</h2>
    <div id="lista-partidas"></div>
    <button class="btn-secundario" style="margin-top:12px;" onclick="alternarFormNovaPartida()"><i class="ti ti-plus"></i> Nova partida</button>
    <div id="form-nova-partida">
      <label>Campeonato</label>
      <select id="nova-campeonato"></select>
      <button style="margin-top:4px;font-size:12px;" onclick="alternarNovoCampeonato()">+ Novo campeonato</button>
      <div id="bloco-novo-campeonato" style="display:none;margin-top:8px;">
        <input type="text" id="input-novo-campeonato" placeholder="Nome do campeonato">
        <button style="margin-top:6px;" onclick="criarCampeonato()">Criar campeonato</button>
      </div>

      <label>Adversário</label>
      <select id="nova-adversario"></select>
      <button style="margin-top:4px;font-size:12px;" onclick="alternarNovoAdversario()">+ Novo adversário</button>
      <div id="bloco-novo-adversario" style="display:none;margin-top:8px;">
        <input type="text" id="input-novo-adversario" placeholder="Nome do adversário">
        <button style="margin-top:6px;" onclick="criarAdversario()">Criar adversário</button>
      </div>

      <label>Fase</label>
      <input type="text" id="nova-fase" placeholder="ex: Quartas de final">

      <label>Data e horário</label>
      <input type="datetime-local" id="nova-data-hora">

      <div class="row2">
        <div>
          <label>Local</label>
          <select id="nova-local">
            <option value="casa">Casa</option>
            <option value="fora">Fora</option>
            <option value="neutro">Neutro</option>
          </select>
        </div>
        <div>
          <label>Duração do tempo (min)</label>
          <input type="number" id="nova-duracao" value="45">
        </div>
      </div>

      <label>Nome do local</label>
      <input type="text" id="nova-local-nome" placeholder="ex: Campo do Bairro">

      <button class="btn-primary" style="width:100%;margin-top:14px;" onclick="criarPartida()">Criar partida</button>
      <p class="erro" id="erro-nova-partida" style="display:none;"></p>
    </div>
  </div>

  <div class="card">
    <h2>Arte de divulgação avulsa</h2>
    <p style="font-size:13px;color:#666;margin:0 0 10px;">Gera uma arte rápida sem precisar criar uma partida no sistema.</p>
    <a id="link-arte-avulsa" href="#" style="display:block;text-align:center;background:#f7f7f7;border-radius:8px;padding:12px;text-decoration:none;color:#1a1a1a;font-weight:500;font-size:14px;">Criar arte avulsa</a>
  </div>
  </div>

  <div id="secao-atletas">
    <div class="card">
      <h2>Elenco</h2>
      <div id="lista-atletas"></div>
      <button class="btn-secundario" style="margin-top:12px;" onclick="alternarFormNovoAtleta()"><i class="ti ti-plus"></i> Novo atleta</button>
      <button id="btn-importar-lista" class="btn-secundario" style="margin-top:8px;" onclick="importarListaSaveFC()"><i class="ti ti-upload"></i> Importar lista Save FC</button>
      <p class="erro" id="erro-importar" style="display:none;"></p>

      <div id="form-novo-atleta" style="display:none;border-top:1px solid #eee;margin-top:12px;padding-top:12px;">
        <label>Foto</label>
        <div style="display:flex;align-items:center;gap:12px;">
          <img id="atleta-foto-preview" src="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;background:#F1F0EE;display:none;">
          <div id="atleta-foto-vazia" style="width:56px;height:56px;border-radius:50%;background:#F1F0EE;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i class="ti ti-shirt-sport" style="color:#B8B6AF;font-size:22px;"></i>
          </div>
          <input type="file" id="atleta-foto-input" accept="image/*" style="font-size:12px;">
        </div>
        <input type="hidden" id="atleta-foto-url">

        <label>Nome completo *</label>
        <input type="text" id="atleta-nome" placeholder="Nome completo">

        <label>Apelido</label>
        <input type="text" id="atleta-apelido" placeholder="Como é chamado no time">

        <div class="row2">
          <div><label>Data de nascimento</label><input type="date" id="atleta-data-nascimento"></div>
          <div><label>CPF</label><input type="text" id="atleta-cpf" placeholder="000.000.000-00" maxlength="14"></div>
        </div>

        <div class="row3">
          <div><label>Idade</label><input type="number" id="atleta-idade" placeholder="anos"></div>
          <div><label>Altura (cm)</label><input type="number" id="atleta-altura"></div>
          <div><label>Peso (kg)</label><input type="number" id="atleta-peso"></div>
        </div>

        <div class="row2">
          <div>
            <label>Posição principal</label>
            <select id="atleta-posicao">
              <option value="">Selecione</option>
              <option>Goleiro</option>
              <option>Zagueiro</option>
              <option>Lateral direito</option>
              <option>Lateral esquerdo</option>
              <option>Volante</option>
              <option>Meia</option>
              <option>Ponta</option>
              <option>Atacante</option>
            </select>
          </div>
          <div>
            <label>Pé dominante</label>
            <select id="atleta-pe">
              <option value="">Selecione</option>
              <option value="destro">Destro</option>
              <option value="canhoto">Canhoto</option>
              <option value="ambidestro">Ambidestro</option>
            </select>
          </div>
        </div>

        <label>Posição(ões) secundária(s)</label>
        <div class="checkbox-grid" id="atleta-posicoes-secundarias">
          <label class="chk"><input type="checkbox" value="Goleiro"> Goleiro</label>
          <label class="chk"><input type="checkbox" value="Zagueiro"> Zagueiro</label>
          <label class="chk"><input type="checkbox" value="Lateral direito"> Lateral direito</label>
          <label class="chk"><input type="checkbox" value="Lateral esquerdo"> Lateral esquerdo</label>
          <label class="chk"><input type="checkbox" value="Volante"> Volante</label>
          <label class="chk"><input type="checkbox" value="Meia"> Meia</label>
          <label class="chk"><input type="checkbox" value="Ponta"> Ponta</label>
          <label class="chk"><input type="checkbox" value="Atacante"> Atacante</label>
        </div>

        <button id="btn-salvar-atleta" class="btn-primary" style="width:100%;margin-top:14px;" onclick="criarAtleta()"><i class="ti ti-check"></i> Cadastrar atleta</button>
        <p class="erro" id="erro-novo-atleta" style="display:none;"></p>
      </div>
    </div>
  </div>

  <div id="secao-adversarios" style="display:none;">
    <div class="card">
      <h2>Adversários</h2>
      <div id="lista-adversarios-tab"></div>
      <button class="btn-secundario" style="margin-top:12px;" onclick="alternarFormNovoAdversarioTab()"><i class="ti ti-plus"></i> Novo adversário</button>

      <div id="form-novo-adversario-tab" style="display:none;border-top:1px solid #eee;margin-top:12px;padding-top:12px;">
        <label>Nome do adversário *</label>
        <input type="text" id="adversario-nome-tab" placeholder="Nome do time">

        <label>URL do escudo (opcional)</label>
        <input type="text" id="adversario-logo-tab" placeholder="https://...">

        <button class="btn-primary" style="width:100%;margin-top:14px;" onclick="criarAdversarioTab()">Cadastrar adversário</button>
        <p class="erro" id="erro-novo-adversario-tab" style="display:none;"></p>
      </div>
    </div>
  </div>

  <div class="sair">
    <button onclick="sair()">Sair</button>
  </div>
</div>
</div>

<nav class="bottom-nav" id="bottom-nav">
  <div class="bottom-nav-itens">
    <div id="nav-partidas" class="bottom-nav-ativo" onclick="mudarAba('partidas')">
      <i class="ti ti-calendar-event bottom-nav-icone"></i>
      <p class="bottom-nav-label">Partidas</p>
    </div>
    <div id="nav-atletas" onclick="mudarAba('atletas')">
      <i class="ti ti-shirt-sport bottom-nav-icone"></i>
      <p class="bottom-nav-label">Atletas</p>
    </div>
    <div id="nav-adversarios" onclick="mudarAba('adversarios')">
      <i class="ti ti-shield bottom-nav-icone"></i>
      <p class="bottom-nav-label">Advers.</p>
    </div>
  </div>
</nav>

<script>
const API = window.location.origin;
let TOKEN = null;
let CLUBE_ID = null;

async function entrar() {
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  const erro = document.getElementById('login-erro');
  erro.style.display = 'none';

  if (!email || !senha) {
    erro.textContent = 'Preencha e-mail e senha.';
    erro.style.display = 'block';
    return;
  }

  try {
    const resp = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(senha)}`,
    });
    if (!resp.ok) throw new Error('E-mail ou senha incorretos.');
    const data = await resp.json();
    TOKEN = data.access_token;

    const meResp = await fetch(`${API}/auth/me`, { headers: authHeader() });
    const me = await meResp.json();
    CLUBE_ID = me.clube_id;

    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-partidas').style.display = 'block';
    document.getElementById('bottom-nav').style.display = 'block';
    document.getElementById('link-arte-avulsa').href = `arte.html?token=${TOKEN}`;
    await carregarListasBase();
    await carregarPartidas();
    const clubeResp = await fetch(`${API}/clubes/${CLUBE_ID}`, { headers: authHeader() });
    if (clubeResp.ok) {
      const clube = await clubeResp.json();
      document.getElementById('header-contexto').textContent = clube.nome;
      document.getElementById('clube-banda').style.display = 'flex';
      document.getElementById('clube-banda').style.background = clube.cor_primaria || '#3D3935';
      const iniciais = (clube.nome || '').split(' ').slice(0, 2).map(p => p[0]).join('').toUpperCase();
      document.getElementById('clube-avatar').textContent = iniciais || 'SC';
    }
  } catch (e) {
    erro.textContent = e.message;
    erro.style.display = 'block';
  }
}

function sair() {
  TOKEN = null;
  CLUBE_ID = null;
  document.getElementById('tela-partidas').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  document.getElementById('header-contexto').textContent = '';
  document.getElementById('clube-banda').style.display = 'none';
  document.getElementById('tela-login').style.display = 'block';
  document.getElementById('login-senha').value = '';
}

function authHeader() {
  return { 'Authorization': `Bearer ${TOKEN}` };
}

let campeonatosCache = [];
let adversariosCache = [];

async function carregarListasBase() {
  const campResp = await fetch(`${API}/campeonatos?clube_id=${CLUBE_ID}`, { headers: authHeader() });
  campeonatosCache = await campResp.json();
  document.getElementById('nova-campeonato').innerHTML =
    campeonatosCache.map(c => `<option value="${c.id}">${c.nome}${c.temporada ? ' (' + c.temporada + ')' : ''}</option>`).join('')
    || '<option value="">Nenhum campeonato — crie um</option>';

  const advResp = await fetch(`${API}/adversarios`, { headers: authHeader() });
  adversariosCache = await advResp.json();
  document.getElementById('nova-adversario').innerHTML =
    adversariosCache.map(a => `<option value="${a.id}">${a.nome}</option>`).join('')
    || '<option value="">Nenhum adversário — crie um</option>';
}

async function carregarPartidas() {
  const resp = await fetch(`${API}/partidas?clube_id=${CLUBE_ID}`, { headers: authHeader() });
  const partidas = await resp.json();
  const mapaAdversarios = Object.fromEntries(adversariosCache.map(a => [a.id, a.nome]));

  const div = document.getElementById('lista-partidas');
  div.innerHTML = partidas.map(p => `
    <div class="linha-partida">
      <div style="flex:1;">
        <div>Save FC x ${mapaAdversarios[p.adversario_id] || '?'}</div>
        <div class="info">${p.fase || ''} · ${new Date(p.data_hora).toLocaleDateString('pt-BR')} · ${p.status}</div>
        <div class="menu-grid">
          <a href="comissao.html?token=${TOKEN}&partida_id=${p.id}">Comissão</a>
          <a href="auxiliar.html?token=${TOKEN}&partida_id=${p.id}">Tempo Real</a>
          <a href="arte.html?token=${TOKEN}&partida_id=${p.id}">Arte</a>
        </div>
      </div>
    </div>
  `).join('') || '<div class="vazio"><i class="ti ti-calendar-event"></i><p>Nenhuma partida criada ainda.</p></div>';
}

function alternarFormNovaPartida() {
  const form = document.getElementById('form-nova-partida');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
}
function alternarNovoCampeonato() {
  const bloco = document.getElementById('bloco-novo-campeonato');
  bloco.style.display = bloco.style.display === 'none' ? 'block' : 'none';
}
function alternarNovoAdversario() {
  const bloco = document.getElementById('bloco-novo-adversario');
  bloco.style.display = bloco.style.display === 'none' ? 'block' : 'none';
}

async function criarCampeonato() {
  const nome = document.getElementById('input-novo-campeonato').value;
  if (!nome) return;
  await fetch(`${API}/campeonatos`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeader() },
    body: JSON.stringify({ clube_id: CLUBE_ID, nome }),
  });
  document.getElementById('input-novo-campeonato').value = '';
  document.getElementById('bloco-novo-campeonato').style.display = 'none';
  await carregarListasBase();
}

async function criarAdversario() {
  const nome = document.getElementById('input-novo-adversario').value;
  if (!nome) return;
  await fetch(`${API}/adversarios`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeader() },
    body: JSON.stringify({ nome }),
  });
  document.getElementById('input-novo-adversario').value = '';
  document.getElementById('bloco-novo-adversario').style.display = 'none';
  await carregarListasBase();
}

async function criarPartida() {
  const erro = document.getElementById('erro-nova-partida');
  erro.style.display = 'none';

  const campeonatoId = document.getElementById('nova-campeonato').value;
  const adversarioId = document.getElementById('nova-adversario').value;
  const dataHora = document.getElementById('nova-data-hora').value;

  if (!campeonatoId || !adversarioId || !dataHora) {
    erro.textContent = 'Preencha campeonato, adversário e data/horário.';
    erro.style.display = 'block';
    return;
  }

  const corpo = {
    clube_id: CLUBE_ID,
    campeonato_id: Number(campeonatoId),
    adversario_id: Number(adversarioId),
    fase: document.getElementById('nova-fase').value || null,
    data_hora: new Date(dataHora).toISOString(),
    local: document.getElementById('nova-local').value,
    duracao_tempo_min: Number(document.getElementById('nova-duracao').value) || 45,
    local_nome: document.getElementById('nova-local-nome').value || null,
  };

  const resp = await fetch(`${API}/partidas`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeader() },
    body: JSON.stringify(corpo),
  });
  const data = await resp.json();
  if (!resp.ok) {
    erro.textContent = data.detail || 'Erro ao criar a partida.';
    erro.style.display = 'block';
    return;
  }

function mascararCpf(valor) {
  const digitos = valor.replace(/\D/g, '').slice(0, 11);
  return digitos
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
}

function redimensionarFoto(arquivo) {
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const TAMANHO_MAX = 240;
        let largura = img.width, altura = img.height;
        if (largura > altura) {
          if (largura > TAMANHO_MAX) { altura *= TAMANHO_MAX / largura; largura = TAMANHO_MAX; }
        } else {
          if (altura > TAMANHO_MAX) { largura *= TAMANHO_MAX / altura; altura = TAMANHO_MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = largura;
        canvas.height = altura;
        canvas.getContext('2d').drawImage(img, 0, 0, largura, altura);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    leitor.onerror = reject;
    leitor.readAsDataURL(arquivo);
  });
}

function calcularIdade(dataNascimento) {
  const nascimento = new Date(dataNascimento);
  if (isNaN(nascimento.getTime())) return null;
  const hoje = new Date();
  let idade = hoje.getFullYear() - nascimento.getFullYear();
  const aindaNaoFezAniversario =
    hoje.getMonth() < nascimento.getMonth() ||
    (hoje.getMonth() === nascimento.getMonth() && hoje.getDate() < nascimento.getDate());
  if (aindaNaoFezAniversario) idade--;
  return idade;
}

function dataNascimentoAproximada(idade) {
  const ano = new Date().getFullYear() - idade;
  return `${ano}-01-01`;
}

async function importarListaSaveFC() {
  const btn = document.getElementById('btn-importar-lista');
  if (btn.disabled) return;  // já está processando, ignora clique repetido
  btn.disabled = true;  // trava JÁ, de forma síncrona, antes de qualquer await
  const textoOriginal = btn.innerHTML;
  const erro = document.getElementById('erro-importar');
  erro.style.display = 'none';

  try {
    const resp = await fetch(`${API}/atletas?clube_id=${CLUBE_ID}`, { headers: authHeader() });
    const jaExistentes = new Set((await resp.json()).map(a => a.nome));
    const faltando = LISTA_SAVE_FC.filter(a => !jaExistentes.has(a.nome));

    if (faltando.length === 0) {
      erro.style.color = '#2E7D0F';
      erro.textContent = 'Todos os 29 atletas já estão cadastrados.';
      erro.style.display = 'block';
      return;
    }

    if (!confirm(`Isso vai cadastrar ${faltando.length} atleta(s) que ainda não existem. Continuar?`)) return;

    btn.innerHTML = '<i class="ti ti-loader-2"></i> Importando...';

    let sucesso = 0;
    for (const atleta of faltando) {
      const r = await fetch(`${API}/atletas`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeader() },
        body: JSON.stringify({
          clube_id: CLUBE_ID,
          nome: atleta.nome,
          data_nascimento: dataNascimentoAproximada(atleta.idade),
        }),
      });
      if (r.ok) sucesso++;
    }

    erro.style.color = '#2E7D0F';
    erro.textContent = `${sucesso} de ${faltando.length} atleta(s) importado(s) com sucesso.`;
    erro.style.display = 'block';
    await carregarAtletas();
  } finally {
    btn.disabled = false;
    btn.innerHTML = textoOriginal;
  }
}

let atletaEditandoId = null;

function editarAtleta(id) {
  const a = atletasCache.find(x => x.id === id);
  if (!a) return;
  atletaEditandoId = id;
  document.getElementById('atleta-nome').value = a.nome || '';
  document.getElementById('atleta-apelido').value = a.apelido || '';
  document.getElementById('atleta-cpf').value = a.cpf || '';
  document.getElementById('atleta-data-nascimento').value = a.data_nascimento || '';
  document.getElementById('atleta-posicao').value = a.posicao_principal || '';
  document.getElementById('atleta-pe').value = a.pe_dominante || '';
  document.getElementById('atleta-altura').value = a.altura_cm || '';
  document.getElementById('atleta-peso').value = a.peso_kg || '';
  document.querySelectorAll('#atleta-posicoes-secundarias input').forEach(c => {
    c.checked = (a.posicoes_secundarias || []).includes(c.value);
  });
  if (a.data_nascimento) {
    const idade = calcularIdade(a.data_nascimento);
    if (idade !== null) document.getElementById('atleta-idade').value = idade;
  }
  if (a.foto_url) {
    mostrarPreviewFoto(a.foto_url);
  } else {
    limparPreviewFoto();
  }
  document.getElementById('form-novo-atleta').style.display = 'block';
  document.getElementById('btn-salvar-atleta').innerHTML = '<i class="ti ti-check"></i> Salvar alterações';
  document.getElementById('form-novo-atleta').scrollIntoView({ behavior: 'smooth' });
}

async function criarAtleta() {
  const erro = document.getElementById('erro-novo-atleta');
  erro.style.display = 'none';
  const nome = document.getElementById('atleta-nome').value;
  if (!nome) {
    erro.textContent = 'Preencha ao menos o nome.';
    erro.style.display = 'block';
    return;
  }

  const editando = !!atletaEditandoId;
  let corpo;
  if (editando) {
    // Edição: só envia campos preenchidos, pra não apagar dado existente sem querer.
    corpo = { nome };
    const apelido = document.getElementById('atleta-apelido').value;
    const cpf = document.getElementById('atleta-cpf').value;
    const dataNasc = document.getElementById('atleta-data-nascimento').value;
    const posicao = document.getElementById('atleta-posicao').value;
    const pe = document.getElementById('atleta-pe').value;
    const altura = document.getElementById('atleta-altura').value;
    const peso = document.getElementById('atleta-peso').value;
    const secundarias = pegarPosicoesSecundariasAtleta();
    if (apelido) corpo.apelido = apelido;
    if (cpf) corpo.cpf = cpf;
    if (dataNasc) corpo.data_nascimento = dataNasc;
    if (posicao) corpo.posicao_principal = posicao;
    if (pe) corpo.pe_dominante = pe;
    if (altura) corpo.altura_cm = Number(altura);
    if (peso) corpo.peso_kg = Number(peso);
    if (secundarias.length > 0) corpo.posicoes_secundarias = secundarias;
    const fotoUrl = document.getElementById('atleta-foto-url').value;
    if (fotoUrl) corpo.foto_url = fotoUrl;
  } else {
    corpo = {
      clube_id: CLUBE_ID,
      nome,
      apelido: document.getElementById('atleta-apelido').value || null,
      cpf: document.getElementById('atleta-cpf').value || null,
      data_nascimento: document.getElementById('atleta-data-nascimento').value || null,
      posicao_principal: document.getElementById('atleta-posicao').value || null,
      pe_dominante: document.getElementById('atleta-pe').value || null,
      altura_cm: document.getElementById('atleta-altura').value ? Number(document.getElementById('atleta-altura').value) : null,
      peso_kg: document.getElementById('atleta-peso').value ? Number(document.getElementById('atleta-peso').value) : null,
      posicoes_secundarias: pegarPosicoesSecundariasAtleta(),
      foto_url: document.getElementById('atleta-foto-url').value || null,
    };
  }

  const resp = await fetch(editando ? `${API}/atletas/${atletaEditandoId}` : `${API}/atletas`, {
    method: editando ? 'PATCH' : 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeader() },
    body: JSON.stringify(corpo),
  });
  const data = await resp.json();
  if (!resp.ok) {
    erro.textContent = data.detail || 'Erro ao salvar atleta.';
    erro.style.display = 'block';
    return;
  }

  atletaEditandoId = null;
  document.getElementById('btn-salvar-atleta').innerHTML = '<i class="ti ti-check"></i> Cadastrar atleta';
  document.getElementById('atleta-nome').value = '';
  document.getElementById('atleta-apelido').value = '';
  document.getElementById('atleta-cpf').value = '';
  document.getElementById('atleta-data-nascimento').value = '';
  document.getElementById('atleta-idade').value = '';
  document.getElementById('atleta-posicao').value = '';
  document.getElementById('atleta-pe').value = '';
  document.getElementById('atleta-altura').value = '';
  document.getElementById('atleta-peso').value = '';
  document.querySelectorAll('#atleta-posicoes-secundarias input:checked').forEach(c => c.checked = false);
  limparPreviewFoto();
  document.getElementById('form-novo-atleta').style.display = 'none';
  await carregarAtletas();
}

  });
  document.getElementById('atleta-data-nascimento').addEventListener('change', (e) => {

      idadeCampo.readOnly = false;

    }
    const idade = calcularIdade(e.target.value);
    if (idade !== null) {
      idadeCampo.value = idade;
      idadeCampo.readOnly = true;
    }
  });
});
